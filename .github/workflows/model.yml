name: 更新模型評分

# 每天收盤後計算「模型參考評分」和「到價機率」用的坡度、晃動，寫進 model.json
on:
  schedule:
    - cron: "40 6 * * 1-5"    # 台灣時間週一到週五 14:40（收盤資料出來之後）
  push:
    branches: [v2]
    paths: ['scripts/update_model.py', '.github/workflows/model.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: cd scripts && python update_model.py
      - name: 有變動才存檔
        run: |
          git add model.json
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git commit -m "更新模型評分 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          git pull --rebase -q && git push
