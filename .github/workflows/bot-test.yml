# 手動測試：在 GitHub 的 Actions 頁面選「測試 stockie」→ Run workflow，選要測哪一則
# 會立刻發一則給你（測試模式下只有你收得到），不管今天有沒有開盤、發過沒有。

name: 測試 stockie

on:
  workflow_dispatch:
    inputs:
      what:
        description: 要測試哪一則
        type: choice
        options: [morning, alert]
        default: morning

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 叫 stockie 發一則
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL=$(gcloud run services describe stockie --region asia-east1 --format='value(status.url)')
          RESULT=$(curl -sS -X POST -H "X-Cron-Secret: $CRON_SECRET" "$URL/cron/${{ inputs.what }}?force=1")
          echo "結果：$RESULT"
          echo "### 結果" >> $GITHUB_STEP_SUMMARY
          echo "\`$RESULT\`" >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | grep -q '"ok":true'
