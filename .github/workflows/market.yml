name: 更新即時行情

on:
  schedule:
    # 台灣時間週一到週五 09:00–13:50，每 10 分鐘一次（GitHub 用 UTC，台灣 = UTC+8）
    - cron: "*/10 1-5 * * 1-5"
    # 收盤後 13:40、14:30 各補抓一次最終數字
    - cron: "40 5 * * 1-5"
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}   # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/update_market.py
      - name: 有變動才存檔
        run: |
          if git diff --quiet -- market.json; then
            echo "行情沒有變動"; exit 0
          fi
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add market.json
          git commit -m "更新行情 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          git push
