<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標的觀察儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 炭灰色系：底色、卡片、文字、紅漲綠跌 */
:root{
  --bg:#2A2B2E; --surface:#35363A; --surface2:#3E3F43; --line:#4B4C51;
  --ink:#EDEDEB; --muted:#A8AAAE; --accent:#B7C2D6; --accent-soft:#44474E;
  --up:#E39EA3; --up-soft:#4A3A3C; --down:#8EC3A6; --down-soft:#354740;
  --now:#C2BBD4; --warn-bg:#3D3830; --warn-ink:#EAD9B5;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
a{color:var(--accent)} a:hover{color:#D3DAE6}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}
header h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat .v{font:600 24px/1.3 var(--mono);margin-top:2px}
.stat .s{font:12px var(--mono);margin-top:2px}
.news{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.news h3{margin:0 0 6px;font-size:12px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between}
.news button{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;padding:6px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font-size:13.5px;cursor:pointer}
.news button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px;padding:12px 0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;padding:5px 12px;border-radius:6px;cursor:pointer;background:none;color:var(--muted);white-space:nowrap;min-height:32px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.search{flex:1 1 180px;max-width:280px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:#6A6C71}
.card.buy{border-color:var(--down);box-shadow:0 0 0 1px var(--down) inset}
.card.tp{border-color:var(--up);box-shadow:0 0 0 1px var(--up) inset}
.card.focus{border-left:4px solid #A9AFB8;padding-left:13px}
.chip{position:absolute;top:-11px;right:14px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:1px 10px 1px 8px;border-radius:999px;line-height:19px;background:var(--surface);border:1px solid currentColor}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.c-head{display:flex;align-items:center;gap:6px;min-width:0}
.code{font:600 13px var(--mono);color:var(--muted)}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.focus{background:#44464A;color:#C3C7CD;border-color:transparent;font-weight:700}
.score{margin-left:auto;font:600 13px var(--mono);padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.score.hi{background:var(--down-soft);color:var(--down)}
.c-name{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.c-name b{font-size:19px;line-height:1.25}
.c-name .px{font:600 15px var(--mono)}
.c-tag{font-size:12.5px;color:var(--muted);min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ladder{position:relative;height:60px;margin:0 2px}
.ladder .rail{position:absolute;left:0;right:0;top:33px;height:3px;border-radius:2px;background:var(--line)}
.ladder .mb{position:absolute;top:30px;width:9px;height:9px;margin-left:-4px;border-radius:3px;background:var(--down);opacity:.9}
.ladder .mt{position:absolute;top:27px;width:3px;height:15px;margin-left:-1px;border-radius:2px;background:var(--up)}
.ladder .now{position:absolute;top:28px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--now);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--now)}
.ladder .lb{position:absolute;transform:translateX(-50%);font:600 11px/13px var(--mono);white-space:nowrap}
.ladder .lb.b{top:44px;color:var(--down)} .ladder .lb.t{top:12px;color:var(--up)}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini{background:var(--surface2);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}
.mini .k{font-size:11px;color:var(--muted)} .mini .v{font:600 15px var(--mono)}
.c-foot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.c-foot b{font:600 16px var(--mono);color:var(--down)}
.c-foot .gain{margin-left:auto;font:600 15px var(--mono);color:var(--up)}
.card.hedge{grid-column:1/-1}
.hd-tiles{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.hd-tile{background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.hd-link{background:var(--accent-soft);border:1px solid #6E7480;text-decoration:none;justify-content:space-between}
.hd-link:hover{border-color:var(--accent)}
.hd-gauge{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--up),var(--line) 50%,var(--down));margin-top:6px}
.hd-gauge span{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:var(--ink);border-radius:2px}
.hd-dot{width:18px;height:18px;border-radius:9px;display:inline-block}
@media (max-width:720px){.hd-tiles{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:3px 8px}
footer{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.7}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* 小檔案（右側滑出） */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--surface);box-shadow:-8px 0 24px rgba(0,0,0,.45);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;z-index:2}
aside.drawer.open{transform:none}
.d-top{padding:22px 28px 0;display:flex;flex-direction:column;gap:14px}
.d-top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-top h2{margin:0;font-size:26px;font-weight:900}
.close{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:22px;cursor:pointer;color:var(--muted);flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;cursor:pointer;padding:10px;min-height:44px;margin-bottom:-1px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.d-body{flex:1;overflow-y:auto;padding:20px 28px 32px;display:flex;flex-direction:column;gap:18px}
.d-body>*,.card>*{flex-shrink:0}   /* 內容很多時不要被壓扁（價格尺會跟文字疊在一起） */
.d-body .ladder{margin:6px 4px 4px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile .v{font:600 22px var(--mono)}
.tile .go{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface2);border-radius:8px;padding:10px 12px}
.fact .v{font:600 18px var(--mono)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:12px;color:var(--muted);font-weight:400;text-align:left;padding:4px}
table.t td{border-top:1px solid var(--line);padding:7px 4px}
table.t .r{text-align:right;font-family:var(--mono)}
.bars{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;align-items:end;height:140px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:140px;gap:3px;font:9.5px var(--mono);color:var(--muted)}
.bars i{display:block;width:100%;border-radius:3px 3px 0 0;background:#6E7480}
.bars i.last{background:var(--accent)}
.blab{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;text-align:center;font-size:10.5px}
.hist{position:relative;height:170px;margin-top:18px}
.hist .cols{position:absolute;top:0;left:0;right:0;bottom:20px;display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:2px;align-items:end}
.hist .cols i{display:block;border-radius:3px 3px 0 0;background:#6E7480}
.hist .vl{position:absolute;top:0;bottom:20px;width:2px}
.hist .vt{position:absolute;top:-18px;transform:translateX(-50%);font-size:11px;font-weight:600;white-space:nowrap;background:var(--surface);padding:0 3px}
.fbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.fbar i{display:block;height:8px;border-radius:4px;background:var(--accent)}
.fbar i.low{background:var(--up)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
details summary{cursor:pointer;font-weight:600}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{border:1px solid var(--line);border-radius:8px;padding:8px 14px;text-decoration:none}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.d-top,.d-body{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>標的觀察儀表板</h1>
    <div class="sub" id="updated">讀取中…</div>
  </header>
  <section class="stats" id="stats" aria-label="大盤"></section>
  <section class="news" id="news" aria-label="追蹤清單最新公告" hidden></section>
  <nav class="filters" aria-label="篩選">
    <div class="seg" role="group" aria-label="分類" data-key="cat"></div>
    <div class="seg" role="group" aria-label="市場" data-key="mk"></div>
    <div class="seg" role="group" aria-label="買點狀態" data-key="st"></div>
    <label style="display:contents"><span hidden>搜尋</span><input class="search" id="q" type="search" placeholder="搜尋代號、名稱、題材…"></label>
    <label style="display:contents"><span hidden>排序</span>
      <select id="sort">
        <option value="order">原表順序</option>
        <option value="tech">技術評分 高→低</option>
        <option value="gain">TP1 漲幅 高→低</option>
        <option value="dist">距買點 近→遠</option>
        <option value="code">代號</option>
      </select></label>
    <span class="count" id="count"></span>
  </nav>
  <main class="grid" id="grid"><div class="empty">讀取中…</div></main>
  <footer>
    買點、目標價、技術評分來自 Google 試算表（即時同步）；股價為證交所、Yahoo Finance 即時行情。<br>
    「模型參考」是依均線、量價、法人、融資、波動算出的保守評分；「到價機率」是依近期均線趨勢與波動估計的機率，都不是預測，也不是投資建議。
  </footer>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="個股小檔案" aria-hidden="true"></aside>

<script>
// ===== 設定 =====
const API = 'https://stockie-5y2lynfn5a-de.a.run.app/api/watchlist';
const BASE = location.hostname.endsWith('github.io') ? './' : 'https://raw.githubusercontent.com/cyw714/stock-dashboard/v2/';

const S = { cat: '全部', mk: '全部', st: '全部', q: '', sort: 'order', tab: 'ov', open: null };
let D = { items: [], market: {}, info: {}, pe: {}, model: {}, prof: {} };

// ===== 小工具 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fp = p => p == null ? '—' : p >= 1000 ? p.toLocaleString('en-US', { maximumFractionDigits: 0 }) : p >= 100 ? p.toFixed(1) : p.toFixed(2);
const fpc = p => p == null ? '—' : `${p > 0 ? '+' : p < 0 ? '−' : ''}${Math.abs(p * 100).toFixed(2)}%`;
const cls = p => p > 0 ? 'up' : p < 0 ? 'down' : 'muted';
const N = x => 0.5 * (1 + erf(x / Math.SQRT2));
function erf(x) { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x); return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)); }
const ZL = { sb: '超級好買點', b2: '買點2', b1: '買點1', tp1: '到 TP1', tp2: '到 TP2', tp3: '到 TP3' };
const isBuy = z => z === 'sb' || z === 'b1' || z === 'b2';
const buyHi = it => [it.buy.b1, it.buy.b2, it.buy.sb].find(L => L && L.hi != null)?.hi ?? null;
const bestBuy = it => it.buy.sb || it.buy.b2 || it.buy.b1;

// 觸及機率：股價（每天坡度 mu、晃動 sig）在 T 天內碰到 B 的機率
function hitP(S0, B, mu, sig, T) {
  if (!S0 || !B || !sig) return null;
  const up = B > S0, b = Math.log(B / S0), m = up ? mu : -mu, bb = Math.abs(b), v = sig * Math.sqrt(T);
  if (bb === 0) return 1;
  if (Math.abs(m) < 1e-12) return 2 * N(-bb / v);
  return Math.min(1, N((-bb + m * T) / v) + Math.exp(2 * m * bb / (sig * sig)) * N((-bb - m * T) / v));
}
const fprob = p => p == null ? '—' : p >= 0.995 ? '已到' : p < 0.001 ? '<0.1%' : `${(p * 100).toFixed(p < 0.1 ? 1 : 0)}%`;

async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }

// ===== 讀資料 =====
async function load(first) {
  const tasks = [getJSON(API)];
  if (first) tasks.push(...['info.json', 'pe.json', 'model.json', 'profiles.json', 'annotations.json'].map(f => getJSON(BASE + f).catch(() => ({}))));
  const [api, info, pe, model, prof, ann] = await Promise.all(tasks);
  D.items = api.items.filter(x => x.code !== 'TAIEX' || x.price != null);
  D.market = api.market || {};
  D.updated = api.updated;
  if (first) { D.info = info; D.pe = pe.data || {}; D.model = model.stocks || {}; D.prof = prof.stocks || {}; D.ann = ann.stocks || {}; }
  // 即時價抓不到時，先用最近一次收盤價（模型資料裡的）頂著，機率也照樣算得出來
  for (const x of D.items) {
    const an = (D.ann || {})[x.code];
    if (an && (!x.note || /見.?圖/.test(x.note))) x.note = an.text;   // 「見右圖」換成圖上的價位
    const md = D.model[x.code];
    if (x.price == null && md) { x.price = md.close; x.pct = null; x.fromClose = md.asof; }
  }
  render();
}

// ===== 畫面 =====
function render() {
  const t = new Date(D.updated);
  $('#updated').textContent = `資料更新：${t.toLocaleString('zh-TW', { hour12: false })}　·　模型評分 ${D.model && Object.keys(D.model).length ? '每天收盤後更新' : '尚未產生'}`;
  const m = D.market;
  const stat = (k, q, digits) => q && q.price ? `<div class="stat"><div class="k">${k}</div><div class="v">${q.price.toLocaleString('en-US', { maximumFractionDigits: digits })}</div><div class="s ${cls(q.pct)}">${q.prev ? (q.price - q.prev > 0 ? '+' : '') + (q.price - q.prev).toFixed(digits) + '　' : ''}${fpc(q.pct)}</div></div>` : `<div class="stat"><div class="k">${k}</div><div class="v">—</div></div>`;
  $('#stats').innerHTML = stat('加權指數', m.index, 2) + stat(m.txf?.night ? '台指期（夜盤）' : '台指期（近月）', m.txf, 0) + stat('那斯達克', m.nasdaq, 2) + stat('費城半導體指數', m.sox, 2);

  const codes = new Set(D.items.map(x => x.code));
  const since = new Date(Date.now() - 3 * 86400000).toISOString().slice(0, 10);
  const news = (D.info.news || []).filter(n => codes.has(n.code) && n.date >= since).slice(0, 6);
  $('#news').hidden = !news.length;
  $('#news').innerHTML = `<h3>追蹤清單最新公告<span style="letter-spacing:0;font-weight:500">近 3 天 · ${news.length} 則</span></h3>` +
    news.map(n => `<button type="button" data-open="${esc(n.code)}" data-tab="news"><span class="mono muted" style="font-size:12px">${esc(n.date.slice(5).replace('-', '/'))} ${esc(n.time)}</span><b>${esc(n.name)}</b><span>${esc(n.title)}</span></button>`).join('');

  segs();
  const list = filtered();
  $('#count').textContent = `顯示 ${list.length} 檔`;
  const ordered = [...list.filter(x => x.code === 'TAIEX'), ...list.filter(x => x.code !== 'TAIEX')];
  $('#grid').innerHTML = ordered.length ? ordered.map(card).join('') : '<div class="empty">沒有符合條件的標的</div>';
  if (S.open) drawer(S.open, false);
}

function segs() {
  const opts = { cat: ['全部', '重點觀察', '其他追蹤'], mk: ['全部', '台股', '美股', '日股'], st: ['全部', '到買點', '到目標價'] };
  document.querySelectorAll('.seg').forEach(el => {
    const k = el.dataset.key;
    el.innerHTML = opts[k].map(o => `<button type="button" aria-pressed="${S[k] === o}" data-seg="${k}" data-val="${o}">${o}</button>`).join('');
  });
}

function filtered() {
  const q = S.q.trim().toLowerCase();
  let list = D.items.filter(x =>
    (S.cat === '全部' || x.group === S.cat) && (S.mk === '全部' || x.market === S.mk) &&
    (S.st === '全部' || (x.code !== 'TAIEX' && (S.st === '到買點' ? isBuy(x.zone) : x.zone && !isBuy(x.zone)))) &&
    (!q || [x.code, x.name, D.prof[x.code]?.name, D.prof[x.code]?.tag, ...(D.prof[x.code]?.ai || [])].join(' ').toLowerCase().includes(q)));
  const gain = x => x.tp.tp1?.lo && x.price ? x.tp.tp1.lo / x.price - 1 : -Infinity;
  const dist = x => buyHi(x) && x.price ? x.price / buyHi(x) - 1 : Infinity;
  const sorts = { tech: (a, b) => (b.scores.tech ?? -1) - (a.scores.tech ?? -1), gain: (a, b) => gain(b) - gain(a), dist: (a, b) => dist(a) - dist(b), code: (a, b) => a.code.localeCompare(b.code) };
  return sorts[S.sort] ? [...list].sort(sorts[S.sort]) : list;
}

function ladderHTML(x, big) {
  const pts = [x.price, ...['b1', 'b2', 'sb'].map(k => x.buy[k]?.hi), ...['tp1', 'tp2', 'tp3'].map(k => x.tp[k]?.lo)].filter(v => v);
  if (pts.length < 2) return '';
  const lo = Math.min(...pts) * 0.96, hi = Math.max(...pts) * 1.04, pos = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + '%';
  let h = '<div class="rail"></div>';
  for (const k of ['b1', 'b2', 'sb']) if (x.buy[k]?.hi) h += `<div class="mb" style="left:${pos(x.buy[k].hi)}" title="${{ b1: '買點1', b2: '買點2', sb: '超級好買點' }[k]} ${esc(x.buy[k].raw)}"></div>`;
  for (const k of ['tp1', 'tp2', 'tp3']) if (x.tp[k]?.lo) h += `<div class="mt" style="left:${pos(x.tp[k].lo)}" title="${k.toUpperCase()} ${esc(x.tp[k].raw)}"></div>`;
  const best = bestBuy(x);
  if (best?.hi) h += `<span class="lb b" style="left:${pos(best.hi)}">${x.buy.sb ? '超' : '買'} ${esc(best.raw)}</span>`;
  if (x.tp.tp1?.lo) h += `<span class="lb t" style="left:${pos(x.tp.tp1.lo)}">T1 ${esc(x.tp.tp1.raw)}</span>`;
  if (big && x.tp.tp2?.lo) h += `<span class="lb t" style="left:${pos(x.tp.tp2.lo)}">T2 ${esc(x.tp.tp2.raw)}</span>`;
  if (x.price) h += `<div class="now" style="left:${pos(x.price)}" title="現價 ${fp(x.price)}"></div>`;
  return `<div class="ladder">${h}</div>`;
}

function probOf(x, L, T) {
  const md = D.model[x.code];
  if (!md || !L || !x.price) return null;
  return hitP(x.price, L, md.prob.mu, md.prob.sigma, T);
}

function histHTML(x, md, targets) {
  const S0 = x.price, T = 60, mu = md.prob.mu, sig = md.prob.sigma, v = sig * Math.sqrt(T), m = Math.log(S0) + mu * T;
  const lo = Math.exp(m - 2.6 * v), hi = Math.exp(m + 2.6 * v), n = 19, w = (hi - lo) / n;
  const pdf = s => Math.exp(-((Math.log(s) - m) ** 2) / (2 * v * v)) / (s * v);
  const ys = Array.from({ length: n }, (_, i) => pdf(lo + (i + 0.5) * w)), mx = Math.max(...ys);
  const pos = s => ((s - lo) / (hi - lo) * 100).toFixed(2) + '%';
  const q1 = Math.exp(m - 0.674 * v), q3 = Math.exp(m + 0.674 * v), med = Math.exp(m), below = N((Math.log(S0) - m) / v);
  const lines = [{ v: S0, c: 'var(--now)', t: `現價 ${fp(S0)}` }, ...targets.filter(t => t.v > lo && t.v < hi).slice(0, 3).map(t => ({ v: t.v, c: `var(--${t.c})`, t: `${t.k} ${fp(t.v)}` }))];
  const out = targets.filter(t => t.v >= hi || t.v <= lo).map(t => t.k);
  return `<section class="sec"><h3>60 天後股價可能落點</h3><div class="hist"><div class="cols">${ys.map(y => `<i style="height:${Math.round(y / mx * 150)}px"></i>`).join('')}</div>
    ${lines.map((l, i) => `<div class="vl" style="left:${pos(l.v)};background:${l.c}"></div><span class="vt" style="left:${pos(l.v)};color:${l.c};top:${-18 + i * 16}px">${l.t}</span>`).join('')}
    <span class="mono muted" style="position:absolute;left:0;bottom:0;font-size:11px">${fp(lo)}</span><span class="mono muted" style="position:absolute;right:0;bottom:0;font-size:11px">${fp(hi)}${out.length ? `（${out.join('、')} 在圖外）` : ''}</span></div>
    <p style="margin:8px 0 0;line-height:1.65">中間一半的情況落在 ${fp(q1)}–${fp(q3)}，中位數 ${fp(med)}；60 天後低於現價的機率約 ${(below * 100).toFixed(0)}%。</p>
    <details class="muted" style="margin-top:6px"><summary>怎麼算的</summary><div style="padding-top:6px;line-height:1.7">用 ${md.asof.slice(5).replace('-', '/')} 收盤為止的均線和波動，配上現在的價格即時計算；每天收盤後更新。<br>坡度：月線 ${fp(md.ma20)} vs 季線 ${fp(md.ma60)} → 每天 ${(md.prob.muRaw * 100).toFixed(3)}%${md.prob.muRaw > 0 ? '，上坡打五折 → ' + (mu * 100).toFixed(3) + '%' : '（下坡照算）'}。晃動：每天約 ${(sig * 100).toFixed(2)}%（年化 ${md.prob.volAnn}%）。</div></details></section>`;
}

function closeDrawer() {
  S.open = null;
  $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open');
}

// ===== 互動 =====
document.addEventListener('click', e => {
  const t = e.target.closest('[data-seg],[data-open],[data-tab],[data-close]');
  if (!t) { if (e.target.id === 'scrim') closeDrawer(); return; }
  if (t.dataset.seg) { S[t.dataset.seg] = t.dataset.val; render(); }
  else if (t.dataset.open) { S.tab = t.dataset.tab || 'ov'; drawer(t.dataset.open); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; drawer(S.open); }
  else if (t.hasAttribute('data-close')) closeDrawer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) closeDrawer(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#sort').addEventListener('change', e => { S.sort = e.target.value; render(); });

load(true).catch(e => { $('#grid').innerHTML = `<div class="empty">資料讀取失敗（${esc(e.message)}），請稍後重新整理。</div>`; });
// 盤中每分鐘更新一次價格
setInterval(() => {
  const t = new Date(Date.now() + 8 * 3600e3), m = t.getUTCHours() * 60 + t.getUTCMinutes(), wd = t.getUTCDay();
  if (wd >= 1 && wd <= 5 && m >= 535 && m <= 820) load(false).catch(() => {});
}, 60000);
</script>
</body>
</html>
