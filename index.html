<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>標的觀察儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 頂部摘要列 → 篩選列 → 個股卡片格 → 點卡片從右側滑出公司小檔案。台股慣例：紅＝漲／目標價，綠＝跌／買點 */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#141B2D; --muted:#5B6478; --line:#DCE0E8;
  --accent:#2C47C9; --accent-soft:#E6EAFB; --up:#B0545D; --up-soft:#F3E7E8; --down:#4C8A6E; --down-soft:#E4EEE9;
  --hot:#6A7E98; --hot-soft:#E5EAF1; --now:#7C74A6; --shadow:0 1px 2px rgba(20,27,45,.06),0 6px 18px rgba(20,27,45,.06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#161C29; --surface-2:#1B2232; --ink:#E6E9F0; --muted:#97A1B5; --line:#2A3246;
  --accent:#8EA2FF; --accent-soft:#232C4D; --up:#D9898F; --up-soft:#33252A; --down:#7DB69B; --down-soft:#1D2D27;
  --hot:#93A5BD; --hot-soft:#232B39; --now:#B1A9DA; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#161C29; --surface-2:#1B2232; --ink:#E6E9F0; --muted:#97A1B5; --line:#2A3246;
  --accent:#8EA2FF; --accent-soft:#232C4D; --up:#D9898F; --up-soft:#33252A; --down:#7DB69B; --down-soft:#1D2D27;
  --hot:#93A5BD; --hot-soft:#232B39; --now:#B1A9DA; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-size:24px;font-weight:600;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat .s.up,.stat .num.up{color:var(--up)}.stat .s.dn,.stat .num.dn{color:var(--down)}
.stat.mover{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.stat.mover:hover{border-color:var(--accent)}
.stat.mover .v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mv-name{font-family:var(--f-body);font-size:19px;font-weight:700}
.stat.mover .v .num{font-size:18px}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px;font-family:var(--f-body)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.search{flex:1 1 180px;min-width:0;max-width:280px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
.sort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.count{color:var(--muted);font-size:13px;margin-left:auto}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card.today{border-left:4px solid var(--hot);padding-left:13px}
.card.st-buy{border-color:var(--down);box-shadow:0 0 0 1px var(--down) inset}
.card.st-tp{border-color:var(--up);box-shadow:0 0 0 1px var(--up) inset}
.card.today.st-buy,.card.today.st-tp{border-left:4px solid var(--hot)}
.st-chip{position:absolute;top:-11px;right:14px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:1px 10px 1px 8px;border-radius:999px;white-space:nowrap;line-height:19px;background:var(--surface);border:1px solid currentColor}
.st-chip.buy{color:var(--down)}
.st-chip.tp{color:var(--up)}
.led{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}50%{opacity:.25;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.led{animation:none}}
.c-tagrow{display:flex;align-items:flex-start;gap:8px}
.c-tagrow .c-tag{flex:1;min-width:0}
.pe-chip{flex:none;font-size:11px;font-family:var(--f-num);padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;margin-top:1px}
.pe-chip.lo{background:var(--down-soft);color:var(--down)}
.pe-chip.hi{background:var(--up-soft);color:var(--up)}
.val-range{position:relative;height:46px;margin-top:6px}
.val-range .track{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--down-soft),var(--surface-2) 40%,var(--surface-2) 60%,var(--up-soft))}
.val-range .med{position:absolute;top:16px;width:2px;height:14px;background:var(--muted);opacity:.6}
.val-range .cur{position:absolute;top:15px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--now);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--now)}
.val-range .lb{position:absolute;top:32px;font-size:11px;font-family:var(--f-num);color:var(--muted)}
.val-range .lb.r{right:0}.val-range .lb.m{transform:translateX(-50%)}
.val-range .lb.top{top:0;color:var(--ink);font-weight:600;transform:translateX(-50%);white-space:nowrap}
.newsbox{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.newsbox h3{margin:0 0 6px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.newsbox h3 span{letter-spacing:0;font-weight:500}
.nrow{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit;font-family:inherit}
.nrow:first-of-type{border-top:0}
.nrow:hover .nt{color:var(--accent)}
.nrow .nd{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.nrow .nn{font-weight:700;white-space:nowrap}
.nrow .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-chip{flex:none;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;margin-top:1px;font-weight:600}
.revchart{width:100%;height:auto;display:block;margin-top:4px}
.rev-note{font-size:13.5px;margin:6px 0 0}
.eps{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.eps th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:4px}
.eps th:first-child,.eps td:first-child{text-align:left}
.eps td{padding:6px 4px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-num)}
.ann{border-top:1px solid var(--line);padding:8px 0}
.ann summary{cursor:pointer;font-size:14px;line-height:1.5;list-style:none}
.ann summary::-webkit-details-marker{display:none}
.ann .ad{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-right:8px}
.ann .ab{white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.65;max-height:260px;overflow:auto}
@media (max-width:720px){.nrow{grid-template-columns:auto 1fr;}.nrow .nd{grid-column:1/-1}}
.val-note{font-size:13.5px;margin:8px 0 0;line-height:1.6}
.c-head{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.c-head .score{flex:none}
.code{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--muted)}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.hot{background:var(--hot-soft);color:var(--hot);border-color:transparent;font-weight:700}
.pill.dup{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.score{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:13px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.score.hi{background:var(--down-soft);color:var(--down)}
.score.mid{background:var(--hot-soft);color:var(--hot)}
.c-row{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.c-row .score{margin-left:auto;flex:none;align-self:center}
.c-name{min-width:0;font-size:19px;font-weight:700;line-height:1.25}
.c-tag{font-size:12.5px;color:var(--muted);min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-foot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.c-foot b{font-family:var(--f-num);font-size:14px;color:var(--ink);font-weight:600}
.c-foot .gain{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--up)}
.c-foot .gain.neg{color:var(--down)}
.c-foot b.best{color:var(--down);font-size:16px}
.c-foot .gain small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);margin-right:4px}

/* price ladder */
.ladder{position:relative;height:60px;margin-inline:2px}
.ladder .rail{position:absolute;left:0;right:0;top:33px;height:3px;border-radius:2px;background:var(--line)}
.ladder .buy{position:absolute;top:30px;height:9px;border-radius:3px;background:var(--down);opacity:.85}
.ladder .tgt{position:absolute;top:27px;width:3px;height:15px;border-radius:2px;background:var(--up)}
.lbl{position:absolute;font-size:11px;line-height:13px;white-space:nowrap;font-family:var(--f-num);font-weight:600}
.lbl.t{top:13px;color:var(--up)}.lbl.t.r1{top:0}
.lbl.b{top:44px;color:var(--down)}.lbl.b.r1{top:58px}
.ladder:has(.lbl.b.r1){height:74px}
.ladder .bk{position:absolute;top:28px;width:3px;height:13px;margin-left:-1px;border-radius:2px;background:var(--down)}.ladder .bk.l2{opacity:.75}.ladder .bk.l3{opacity:.55}
.big .ladder .bk{top:33px;height:18px}
.big .ladder:has(.lbl.b.r1){height:90px}
.ladder .tgt.t2{opacity:.7}.ladder .tgt.t3{opacity:.45}
.ladder .tgt.ix{background:var(--down);opacity:1}.ladder .tgt.ix.l2{opacity:.8}.ladder .tgt.ix.l3{opacity:.6}
.lbl.t.ix{color:var(--down)}.big .lbl.t.ix{color:var(--down)}
.ladder .now{position:absolute;top:28px;width:13px;height:13px;margin-left:-5px;border-radius:50%;background:var(--now);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--now);z-index:2}
.big .ladder .now{top:35px;width:15px;height:15px;margin-left:-6px}
.c-quote{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.c-quote .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--now);align-self:center}
.c-quote b{font-family:var(--f-num);font-size:16px;color:var(--ink);font-weight:600}
.c-quote .chg{font-family:var(--f-num);font-weight:600;font-size:14px}
.chg.up{color:var(--up)}.chg.dn{color:var(--down)}
.c-quote .wait{font-size:12px}
.now-line{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);margin-bottom:2px}
.now-line b{font-family:var(--f-num);font-size:17px;color:var(--ink)}
.stat .list{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.stat .list span{white-space:nowrap}
.stat .list b{color:var(--ink);font-weight:600;margin-right:4px}
.big .ladder{height:84px;margin-top:4px}
.big .ladder .rail{top:40px;height:4px}
.big .ladder .buy{top:36px;height:12px}
.big .ladder .tgt{top:32px;height:20px}
.big .lbl{font-size:11px;line-height:14px;font-weight:500}
.big .lbl.t{top:15px;color:var(--up)}.big .lbl.t.r1{top:0}
.big .lbl.b{top:55px;color:var(--down)}.big .lbl.b.r1{top:70px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 32px);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}.card{transition:none}}
.d-top{display:flex;gap:12px;align-items:flex-start}
.d-top h2{margin:0;font-size:26px;font-weight:900;line-height:1.2}
.d-top .meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px;flex:none}
.sec{margin-top:24px}
.sec h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-size:17px;font-weight:600;margin-top:2px}
.fact.wide{grid-column:1/-1}.fact .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:6px}
.lv td.al{color:var(--hot);font-weight:600;text-align:right;white-space:nowrap}
.biz{margin:10px 0 0;font-size:14.5px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 10px;font-size:13px;font-weight:500}
.ai-note{margin:10px 0 0;font-size:14px;line-height:1.7;color:var(--ink)}
.set{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.set + .set{margin-top:10px}
.set-h{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.lv{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
.lv td{padding:6px 4px;border-top:1px solid var(--line)}
.lv td:nth-child(2),.lv td:nth-child(3){text-align:right;font-family:var(--f-num)}
.lv .b td:first-child{color:var(--down);font-weight:500}
.lv .t td:first-child{color:var(--up);font-weight:500}
.lv .orig{color:var(--muted);font-size:11.5px;font-family:var(--f-body);margin-left:6px}
.pct.up{color:var(--up)}.pct.dn{color:var(--down)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:56px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .n{font-family:var(--f-num);text-align:right}
.note{background:var(--hot-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.links a:hover{border-color:var(--accent)}
.src{font-size:11.5px;color:var(--muted);margin-top:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:30;font-size:13px;max-width:calc(100% - 32px)}
.foot{margin-top:32px;color:var(--muted);font-size:12px;line-height:1.7}

@media (max-width:720px){
  .wrap{padding-inline:16px;padding-block:16px 40px}
  .top{align-items:center}
  .top h1{font-size:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
  .stat{padding:10px 12px}
  .stat .v{font-size:21px}
  .filters{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-block:4px 8px}
  .seg{grid-column:1/-1;display:flex}
  .seg button{flex:1;padding:8px 6px;font-size:14px}
  .search{grid-column:1/-1;max-width:none;padding:10px 12px;font-size:15px}
  .sort{padding:9px 10px;font-size:14px}
  .count{margin:0;align-self:center;text-align:right}
  .grid{grid-template-columns:1fr;gap:12px}
  .card{padding:16px 16px 14px}
  .card.today{padding-left:13px}
  .c-name{font-size:21px}
  .c-tag{font-size:13.5px;min-height:0}
  .lbl{font-size:12px}
  .c-foot{font-size:13px}
  .c-foot b{font-size:16px}
  .c-quote b{font-size:18px}
  .c-quote .chg{font-size:15px}
  .c-foot b.best{font-size:18px}
  .c-foot .gain{font-size:17px}
  .drawer{padding-inline:16px}
  .d-top h2{font-size:24px}
  .facts{grid-template-columns:1fr 1fr}
  .lv{font-size:14.5px}
}

</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <h1>標的觀察儀表板</h1>
      <div class="sub" id="sub">資料更新：2026/10/7</div>
    </div>
    <div class="actions">

let PROFILE = DATA.prof;

const $ = s => document.querySelector(s);
const fmt = n => n==null||n==="" ? "—" : Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
const isNum = v => typeof v==="number" && isFinite(v);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LV = [["sb","超級好買點","b"],["b2","買點2","b"],["b1","買點1","b"],["t1","TP1","t"],["t2","TP2","t"],["t3","TP3","t"]];

let rows = DATA.rows, source = DATA.source;

const state = {cat:"全部", mkt:"全部", st:"全部", q:"", sort:"order"};

function avg(sc, sheetAvg){ if(isNum(sheetAvg)) return sheetAvg; const v = (sc||[]).filter(isNum); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function gain(r){ return isNum(r.b1) && isNum(r.t1) ? r.t1/r.b1-1 : null; }

// 同代號合併成一張卡（第一筆當主資料）
function groups(){
  const m = new Map();
  rows.forEach((r,i) => { const k = String(r.code).toUpperCase(); if(!m.has(k)) m.set(k,{code:k,sets:[],order:i}); m.get(k).sets.push(r); });
  return [...m.values()].map(g => { const p = g.sets[0]; return {...g, name:g.code==="TAIEX"?"加權指數":(PROFILE[g.code]?.name||p.name||g.code), mkt:p.mkt, today:g.sets.some(s=>s.cat==="今日即時"), score:avg(p.sc, p.avg), gain:gain(p), main:p, prof:PROFILE[g.code]}; }).map(g => { const s = buyState(g); g.st = s; g.dist = s ? s.dist : null; return g; });
}

const Q = code => {
  if(String(code).toUpperCase()==="TAIEX"){ const i = MARKET && MARKET.index; if(i && isNum(i.value)) return {price:i.value, pct:i.pct}; }
  return (MARKET && MARKET.quotes && MARKET.quotes[String(code).toUpperCase()]) || null;
};
const isIdx = g => g && g.code==="TAIEX";
// 大盤避險加碼：B 欄寫「25%,25%,50%」→ 依序對應買點1、買點2、超級好買點
function allocText(r){ if(!r.alloc) return ""; const ks = ["b1","b2","sb"].filter(k=>isNum(r[k])); return ks.map((k,i)=>`${fmt(r[k])} 加碼 ${r.alloc[i]??"?"}%`).join("・"); }
function ladder(r, big, now){
  const vals = LV.map(([k])=>r[k]).filter(isNum);
  if(isNum(now) && vals.length>=2) vals.push(now);
  if(vals.length<2) return `<div class="ladder"><div class="rail"></div></div>`;
  let lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi-lo)*0.08; lo-=pad; hi+=pad;
  const pct = v => (v-lo)/(hi-lo)*100, x = v => pct(v).toFixed(2)+"%";
  const buys = ["sb","b2","b1"].map(k=>r[k]).filter(isNum);
  let h = `<div class="ladder"><div class="rail"></div>`;
  if(r.alloc){   // 大盤：三個加碼點各畫一條，標上加碼比例
    const ks = ["b1","b2","sb"].filter(k=>isNum(r[k]));
    ks.forEach((k,i)=>{ h += `<div class="tgt ix l${i+1}" style="left:${x(r[k])}"></div>`; });
    if(isNum(now)) h += `<div class="now" style="left:${x(now)}" title="現價 ${fmt(now)}"></div>`;
    const cw = big ? 1.45 : 2.5, lastEnd=[-1e9,-1e9];
    ks.map((k,i)=>({v:r[k], text: big ? `第${i+1}次 ${fmt(r[k])}（${r.alloc[i]??"?"}%）` : `${fmt(r[k])}・${r.alloc[i]??"?"}%`})).sort((a,b)=>a.v-b.v).forEach(it=>{
      const pos=pct(it.v), w=it.text.length*cw+3, row=(pos-w/2>lastEnd[0])?0:1; lastEnd[row]=pos+w/2;
      const tf = pos<10 ? "translateX(-2px)" : pos>90 ? "translateX(calc(-100% + 3px))" : "translateX(-50%)";
      h += `<span class="lbl t ix r${row}" style="left:${pos.toFixed(2)}%;transform:${tf}">${it.text}</span>`; });
    return h + `</div>`;
  }
  // 買點：買點1、買點2、超級好買點各畫一條（同價位只畫一次）
  const BK = [["b1","買1"],["b2","買2"],["sb","超好"]].filter(([k])=>isNum(r[k])).filter(([k],i,arr)=>arr.findIndex(([k2])=>r[k2]===r[k])===i);
  BK.forEach(([k],i)=>{ h += `<div class="bk l${i+1}" style="left:${x(r[k])}" title="${k==="sb"?"超級好買點":k==="b1"?"買點1":"買點2"} ${fmt(r[k])}"></div>`; });
  ["t1","t2","t3"].forEach((k,i)=>{ if(isNum(r[k])) h += `<div class="tgt t${i+1}" style="left:${x(r[k])}"></div>`; });
  if(isNum(now)) h += `<div class="now" style="left:${x(now)}" title="現價 ${fmt(now)}"></div>`;
  // 標籤：重疊時自動換到第二排，靠邊的往內縮
  const cw = big ? 1.45 : 2.5;
  const place = (items, cls) => { const lastEnd=[-1e9,-1e9]; items.sort((a,b)=>a.v-b.v).forEach(it=>{
    const pos=pct(it.v), w=it.text.length*cw+3; const row = (pos - w/2 > lastEnd[0]) ? 0 : 1;
    lastEnd[row] = pos + w/2;
    const tf = pos<10 ? "translateX(-2px)" : pos>90 ? "translateX(calc(-100% + 3px))" : "translateX(-50%)";
    h += `<span class="lbl ${cls} r${row}" style="left:${pos.toFixed(2)}%;transform:${tf}">${it.text}</span>`; }); };
  place(["t1","t2","t3"].filter(k=>isNum(r[k])).map(k=>({v:r[k],text:k.toUpperCase().replace("T","T")+" "+fmt(r[k])})), "t");
  // 太靠近的買點合併成一個標籤，避免文字疊在一起
  const bl = BK.map(([k,lab])=>({v:r[k], text: big ? `${lab} ${fmt(r[k])}` : fmt(r[k])})).sort((a,b)=>a.v-b.v), merged = [];
  for(const it of bl){ const last = merged[merged.length-1];
    if(last && (pct(it.v) - pct(last.v)) < (last.text.length + it.text.length) * cw / 2 + 2){ last.text = last.text + "／" + it.text; last.v = (last.v + it.v) / 2; }
    else merged.push({...it}); }
  place(merged, "b");
  return h + `</div>`;
}

// 實際量標籤位置：超出邊界就貼齊邊緣，同一排重疊就換到上一排
function fixLabels(root){
  root.querySelectorAll(".ladder").forEach(L => {
    const lr = L.getBoundingClientRect(); if(!lr.width) return;
    const labs = [...L.querySelectorAll(".lbl")];

function buyState(g){
  const q = Q(g.code), r = g.main; if(!q || !isNum(q.price)) return null;

  if(tps.length) return {kind:"tp", text:`已達 ${tps[0].toUpperCase()}`, dist: isNum(hi) ? p/hi-1 : 9};
  if(!isNum(hi)) return null;
  const d = p/hi-1;
  if(p <= hi && isIdx(g)){ const n = ["b1","b2","sb"].filter(k => isNum(r[k]) && p <= r[k]).length; return {kind:"buy", text:`已到第 ${n} 次加碼點`, dist:d}; }

        <div class="bar"><b>平均</b><div class="track"><div class="fill" style="width:${g.score?g.score*10:0}%;background:var(--down)"></div></div><b class="n">${g.score!=null?g.score.toFixed(1):"—"}</b></div></div>`

    <section class="sec"><h3>延伸閱讀</h3><div class="links">
      ${tw ? `<a href="https://tw.stock.yahoo.com/quote/${code}/profile" target="_blank" rel="noopener">Yahoo 公司資料</a>

      : isIdx(g) ? `<a href="https://tw.stock.yahoo.com/quote/%5ETWII" target="_blank" rel="noopener">Yahoo 加權指數</a>`
      : `<a href="https://finance.yahoo.com/quote/${code}${g.mkt==="日股"?".T":""}/profile" target="_blank" rel="noopener">Yahoo Finance</a>`}
    </div>${p?.cap?`<div class="src">股本資料日期：${esc(p.date||"未填")}（Excel「公司檔案」）</div>`:""}</section>`;
  $("#drawer").hidden = false; $("#scrim").hidden = false; document.body.style.overflow = "hidden";

$("#grid").addEventListener("click", e => { const c = e.target.closest(".card"); if(c) open(c.dataset.code); });

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3200); }

// 網頁打開時讀取同一個資料夾裡的 data.xlsx；讀不到就用內建資料
const n = v => v==null||v==="" ? null : (typeof v==="number" ? v : (isFinite(+v) ? +v : null));
// 原始格式的價位常有「147X」「<125」「177-180」「195附近」這類寫法，轉成數字，原寫法另外保留
function toNum(v){
  if(v==null || v==="") return [null, null];
  if(typeof v==="number") return [v, null];
  const t = String(v).trim().replace(/,/g,"");
  if(/^\d+(\.\d+)?$/.test(t)) return [+t, null];
  let m;
  if((m = t.match(/^(\d+(?:\.\d+)?)\s*[-~～]\s*(\d+(?:\.\d+)?)/))) return [Math.max(+m[1], +m[2]), t];
  if((m = t.match(/^[<＜]\s*(\d+(?:\.\d+)?)/))) return [+m[1], t];
  if((m = t.match(/^(\d+)([Xx]+)/))) return [+m[1] * Math.pow(10, m[2].length), t];
  if((m = t.match(/^(\d+(?:\.\d+)?)\s*附近/))) return [+m[1], t];
  if((m = t.match(/^(\d+(?:\.\d+)?)/))) return [+m[1], t];
  return [null, t];
}
// 非台股代號：試算表裡寫的名字 → (代號, 市場)
const FOREIGN = {"CRDO":["CRDO","美股"],"ALAB":["ALAB","美股"],"NBIS":["NBIS","美股"],"KIOXIA":["285A","日股"],"瑞薩":["6723","日股"],
  "日東紡":["3110","日股"],"AAOI":["AAOI","美股"],"SANDISK":["SNDK","美股"],"SNDK":["SNDK","美股"],"LITE":["LITE","美股"]};
function codeOf(raw){
  const t = String(raw).trim().replace(/\.0$/,"");
  if(/^(大盤|加權指數|加權|TAIEX|\^?TWII)$/i.test(t)) return ["TAIEX", "指數"];
  const f = FOREIGN[t.toUpperCase()] || FOREIGN[t];
  if(f) return f;
  if(/^\d{4,6}[A-Z]?$/.test(t)) return [t, "台股"];
  return [t.toUpperCase(), "美股"];
}
function parseOriginal(wb){
  const out = [];
  const keys = ["b1","b2","sb","t1","t2","t3"];
  const addRow = (raw, cat, note, prices, scores, extra = {}) => {
    const [code, mkt] = codeOf(raw);
    const r = {cat, mkt, code, name:null, sc:scores.map(v=>{ const x = toNum(v)[0]; return x; }), note: note ? String(note).trim() : null};
    if(isNum(extra.mcap)) r.mcap = extra.mcap;
    if(isNum(extra.avg)) r.avg = extra.avg;
    if(mkt==="指數" && r.note){ const a = r.note.match(/\d+(?:\.\d+)?(?=\s*%)/g); if(a){ r.alloc = a.map(Number); r.note = null; } }
    const orig = {};
    keys.forEach((k,i)=>{ const [x, o] = toNum(prices[i]); r[k] = x; if(o) orig[k] = o; });
    if(Object.keys(orig).length) r.orig = orig;
    out.push(r);
  };
  const dom = wb.Sheets["國內"];
  if(dom){
    const A = XLSX.utils.sheet_to_json(dom, {header:1, blankrows:true, defval:null});
    // 依標題列找欄位（之後插入新欄也不會抓錯）；找不到就用預設位置
    const H = (A[0] || []).map(v => String(v ?? "").replace(/\s/g,""));
    const col = (re, d) => { const i = H.findIndex(h => re.test(h)); return i >= 0 ? i : d; };
    const cP = ["買點1","買點2","超級好買點","TP1","TP2","TP3"].map((k,i) => col(new RegExp("^"+k+"$","i"), 2+i));
    const cCap = col(/^市值/, -1), cAvg = col(/平均/, -1);
    const cSc = [col(/技術/, cCap>=0?9:8), col(/把握/, cCap>=0?10:9), col(/基本/, cCap>=0?11:10)];
    const num = v => toNum(typeof v === "string" ? v.replace(/,/g,"") : v)[0];
    let cat = "追蹤中", inToday = false;
    for(let i=1; i<A.length; i++){
      const row = A[i] || [], a = row[0];
      const empty = row.slice(0,8).every(v => v==null || String(v).trim()==="");
      if(a!=null && String(a).includes("今日")){ cat = "今日即時"; inToday = true; continue; }
      if(empty){ if(inToday){ cat = "追蹤中"; inToday = false; } continue; }
      if(a==null || String(a).trim()==="") continue;
      addRow(a, cat, row[1], cP.map(i=>row[i]), cSc.map(i=>row[i]), {mcap: cCap>=0 ? num(row[cCap]) : null, avg: cAvg>=0 ? num(row[cAvg]) : null});
    }
  }
  const fx = wb.Sheets["國外"];
  if(fx){
    const A = XLSX.utils.sheet_to_json(fx, {header:1, blankrows:false, defval:null});
    for(let i=1; i<A.length; i++){
      const row = A[i] || [];
      if(row[0]==null || String(row[0]).trim()==="") continue;
      addRow(row[0], "追蹤中", null, row.slice(1,7), [null,null,null]);
    }
  }
  if(!out.length) throw new Error("試算表裡沒有讀到任何代號");
  return {rows: out, prof: PROFILE};
}
function parseWorkbook(wb){
  const ws = wb.Sheets["標的清單"];
  if(!ws && (wb.Sheets["國內"] || wb.Sheets["國外"])) return parseOriginal(wb);
  if(!ws) throw new Error("找不到「標的清單」或「國內」分頁");
  const out = XLSX.utils.sheet_to_json(ws, {range:1, defval:null}).filter(d=>d["代號"]!=null && d["代號"]!=="").map(d=>({
    cat:d["分類"]||"追蹤中", mkt:d["市場"]||"台股", code:String(d["代號"]).trim(), name:(d["名稱"]&&d["名稱"]!=="請先到公司檔案新增")?d["名稱"]:null,
    b1:n(d["買點1"]), b2:n(d["買點2"]), sb:n(d["超級好買點"]), t1:n(d["TP1"]), t2:n(d["TP2"]), t3:n(d["TP3"]),
    sc:[n(d["技術面"]), n(d["把握度"]), n(d["基本面"])], note:d["備註"]||null })).filter(d=>d.cat!=="已出場");
  if(!out.length) throw new Error("「標的清單」裡沒有讀到任何代號");
  let prof = PROFILE;
  const ps = wb.Sheets["公司檔案"];
  if(ps){
    prof = {};
    XLSX.utils.sheet_to_json(ps, {defval:null, raw:true}).forEach(d=>{
      const code = d["代號"]==null ? "" : String(d["代號"]).trim(); if(!code) return;
      const dt = d["資料日期"];
      prof[code.toUpperCase()] = { name:d["名稱"]||null, mkt:d["市場"]||null, ind:d["產業"]||"", cap:n(d["股本(億元)"]),
        tag:d["一句話定位"]||"", biz:d["主要業務"]||"", ai:String(d["AI 題材"]||"").split(/[、,，\/／]\s*/).filter(Boolean),
        aiNote:d["AI 題材說明"]||"", date: typeof dt==="number" ? XLSX.SSF.format("yyyy/mm/dd", dt) : (dt||"") };
    });
  }
  return {rows:out, prof};
}
// 清單資料來源：先讀 Google 試算表（透過 Worker），讀不到再讀 GitHub 上的 data.xlsx，都不行就用內建資料
async function loadExcel(){
  if(!window.XLSX){ $("#sub").textContent = "資料更新：" + source + "（Excel 解析套件沒有載入，顯示內建資料）"; return; }
  const tries = [];
  if(LIVE_API) tries.push([LIVE_API + "/sheet?t=" + Date.now(), "Google 試算表"]);
  tries.push(["data.xlsx?t=" + Date.now(), "data.xlsx"]);
  for(const [url, label] of tries){
    try{
      const res = await fetch(url, {cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      const d = parseWorkbook(XLSX.read(await res.arrayBuffer()));
      rows = d.rows; PROFILE = d.prof;
      const t = new Date();
      source = label === "Google 試算表" ? `Google 試算表（${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} 讀取）`
             : ((res.headers.get("Last-Modified") ? new Date(res.headers.get("Last-Modified")) : t).toLocaleDateString("zh-TW") + "（data.xlsx）");
      render(); return;
    }catch(err){ console.warn(label, err); }
  }
  $("#sub").textContent = "資料更新：" + source + "（讀不到試算表，顯示內建資料）";
}

// ---------- 即時行情（market.json 由 GitHub 排程每 10 分鐘更新） ----------
let MARKET = null;
const sign = v => (v>0?"+":"") ;
const pctTxt = v => v==null ? "" : sign(v) + (v*100).toFixed(2) + "%";
const cls = v => v>0 ? "up" : v<0 ? "dn" : "";
const buyTop = r => isNum(r.b1) ? r.b1 : isNum(r.b2) ? r.b2 : r.sb;
function renderMarket(){
  const m = MARKET, ok = m && m.updated;
  const fmtV = (v, d) => v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  const chg = (o, d) => `<span class="num ${cls(o.change)}">${sign(o.change)}${o.change.toFixed(d)}（${pctTxt(o.pct)}）</span>`;
  const empty = lab => `<div class="stat"><div class="k">${lab}</div><div class="v num">—</div><div class="s">${ok?"沒有抓到資料":"等待行情資料"}</div></div>`;
  const tile = (lab, o, d, extra="") => o ? `<div class="stat"><div class="k">${lab}</div><div class="v num">${fmtV(o.value,d)}</div>
      <div class="s">${chg(o,d)}${o.label?`・${esc(o.label)}`:""}</div>${extra}</div>` : empty(lab);
  const nq = ok && m.nasdaq || {};
  const nqExtra = nq.fut ? `<div class="list">期貨 <b class="num">${fmtV(nq.fut.value,0)}</b> ${chg(nq.fut,0)}</div>` : "";
  $("#stats").innerHTML = tile("加權指數", ok && m.index, 2) + tile("台指期（近月）", ok && m.futures, 0)
    + (nq.index ? tile("那斯達克指數", nq.index, 2, nqExtra) : nq.fut ? tile("那斯達克期貨", nq.fut, 0) : empty("那斯達克"))
    + tile("費城半導體指數", ok && m.sox, 2);
}
// 即時行情來源：填了 Cloudflare Worker 網址就每 30 秒直接抓即時報價；沒填就讀 GitHub 排程產生的 market.json
const LIVE_API = "https://stock-live.melody94wang.workers.dev";
function liveQuery(){
  const by = {台股:[], 美股:[], 日股:[]};
  groups().forEach(g => { if(g.mkt==="指數") return; (by[g.mkt] || by["台股"]).push(g.code); });
  return `tw=${by["台股"].join(",")}&us=${by["美股"].join(",")}&jp=${by["日股"].join(",")}`;
}
// GitHub 排程存的 market.json：當備援，也補上 Worker 抓不到的項目（台指期）
let BACKUP = null, backupAt = 0;
async function loadBackup(){
  if(Date.now() - backupAt < 110 * 1000 && BACKUP) return BACKUP;
  try{ const r = await fetch("market.json?t=" + Date.now(), {cache:"no-store"}); if(r.ok){ BACKUP = await r.json(); backupAt = Date.now(); } }catch(_){}
  return BACKUP;
}
async function loadMarket(){
  const backup = await loadBackup();
  let live = null;
  if(LIVE_API){
    try{ const res = await fetch(LIVE_API + "?" + liveQuery(), {cache:"no-store"}); if(res.ok) live = await res.json(); }catch(_){}
  }
  if(live && live.updated){
    const b = backup || {};
    for(const k of ["index","futures","sox"]) if(!live[k] && b[k]) live[k] = b[k];
    if(!live.nasdaq || (!live.nasdaq.index && !live.nasdaq.fut)) live.nasdaq = b.nasdaq || live.nasdaq;
    live.quotes = Object.assign({}, b.quotes || {}, live.quotes || {});
    MARKET = live;
  } else if(backup && backup.updated){
    MARKET = backup;
  } else return;
  render();
}
render();
loadExcel().then(loadMarket);
loadPE();
loadInfo();
setInterval(loadInfo, 10 * 60 * 1000);
setInterval(loadExcel, 5 * 60 * 1000);
setInterval(loadMarket, (LIVE_API ? 30 : 120) * 1000);
</script>
